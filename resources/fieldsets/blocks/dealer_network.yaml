title: Dealer network
fields:
- handle: heading
  field:
    type: text
    display: Heading
    validate: required
    instructions: Judul bagian.
- handle: stats
  field:
    type: grid
    display: Network statistics
    mode: stacked
    add_row: Add statistic
    fields:
    - handle: value
      field:
        type: text
        display: Value
        validate: required
        instructions: Nilai angka.
    - handle: label
      field:
        type: text
        display: Label
        validate: required
        instructions: Teks label.
    instructions: Statistik.
- handle: tab_branches_label
  field:
    type: text
    display: Branches tab label
    default: Cabang & Dealer
    instructions: Label tab cabang.
- handle: tab_service_label
  field:
    type: text
    display: Service tab label
    default: Service Center
    instructions: Label tab servis.
- handle: tab_parts_label
  field:
    type: text
    display: Parts tab label
    default: Part Shop
    instructions: Label tab suku cadang.
- handle: dealers
  field:
    type: entries
    display: Dealers / locations
    collections:
    - dealers
    instructions: Pilih dealer.
- handle: map_embed_url
  field:
    type: text
    display: Map embed URL
    instructions: URL embed peta.

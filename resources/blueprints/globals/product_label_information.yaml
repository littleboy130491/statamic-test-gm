title: 'Product Label Information'
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Archive Single Product'
        fields:
          -
            handle: category_labels
            field:
              type: text
              display: 'Category Labels'
              validate:
                - required
          -
            handle: industry_labels
            field:
              type: text
              display: 'Industry Labels'
              validate:
                - required
          -
            handle: spesification_labels
            field:
              type: text
              display: 'Spesification Labels'
              validate:
                - required
          -
            handle: comparison_labels
            field:
              type: text
              display: 'Comparison Labels'
              validate:
                - required
          -
            handle: product_not_found
            field:
              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - image
                - table
              container: assets
              remove_empty_nodes: false
              type: bard
              display: 'Product Not Found'
              validate:
                - required
          -
            handle: benefit_label
            field:
              type: text
              display: 'Benefit Label'
              validate:
                - required
          -
            handle: product_sort_order_by
            field:
              options:
                -
                  key: tanggal_upload
                  value: 'Tanggal Upload'
                -
                  key: urutan_tree
                  value: 'Urutan Tree (Statamic)'
                -
                  key: judul_az
                  value: 'Judul A-Z'
                -
                  key: judul_za
                  value: 'Judul Z-A'
              default: tanggal_upload
              type: select
              display: 'Product Sort Order By'
              validate:
                - required
      -
        display: 'Comparison & Spesification'
        fields:
          -
            handle: type_labels
            field:
              type: text
              display: 'Type Labels'
              validate:
                - required
              width: 33
          -
            handle: model_labels
            field:
              type: text
              display: 'Model Labels'
              width: 33
              validate:
                - required
          -
            handle: empty_placeholder_data
            field:
              type: text
              display: 'Empty Placeholder Data'
              validate:
                - required
              width: 33
          -
            handle: spesification_info
            field:
              type: checkboxes
              display: 'Spesification Info'
              options:
                -
                  key: power
                  value: Power
                -
                  key: torque
                  value: Torque
                -
                  key: standard_emission
                  value: 'Standard Emission'
                -
                  key: gcw
                  value: GCW
                -
                  key: gvw
                  value: GVW
                -
                  key: fuel_tank_capacity
                  value: 'Fuel Tank Capacity'
                -
                  key: dump_dimensions
                  value: 'Dump Dimensions'
                -
                  key: transmission
                  value: Transmission
                -
                  key: brake_system
                  value: 'Brake System'
              default:
                - power
                - torque
                - standard_emission
                - gcw
                - gvw
                - fuel_tank_capacity
      -
        display: 'Skin Product'
        fields:
          -
            handle: image_placeholders
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Image Placeholders'
              validate:
                - required
          -
            handle: image_features_benefit_placeholder
            field:
              container: assets
              type: assets
              display: 'Image Features & Benefit Placeholder'
              validate:
                - required
          -
            handle: background_image_placeholder
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Background image Placeholder'
              validate:
                - required
          -
            handle: background_pattern_image
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Background Pattern Image'

              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - image
                - table
              container: assets
              remove_empty_nodes: false
              type: bard
              display: 'Product Not Found'
              validate:
                - required
          -
            handle: benefit_label
            field:
              type: text
              display: 'Benefit Label'

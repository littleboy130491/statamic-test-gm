title: 'Contact Label Information'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: phone_number_heading
            field:
              type: text
              display: 'Phone Number Heading'
              instructions: 'Judul bagian telepon.'
              validate:
                - required
          -
            handle: email_heading
            field:
              type: text
              display: 'Email Heading'
              instructions: 'Judul bagian email.'
              validate:
                - required
          -
            handle: address_heading
            field:
              type: text
              display: 'Address Heading'
              instructions: 'Judul bagian alamat.'
              validate:
                - required
          -
            handle: social_media_labels
            field:
              type: text
              display: 'Social Media Labels'
              instructions: 'Label bagian media sosial.'
              validate:
                - required
          -
            handle: submit_button_label
            field:
              type: text
              display: 'Submit Button Label'
              instructions: 'Teks tombol kirim.'
              validate:
                - required
          -
            handle: success_message
            field:
              buttons:
                - bold
                - italic
                - removeformat
                - quote
                - anchor
              container: assets
              remove_empty_nodes: false
              type: bard
              display: 'Success message'
              instructions: 'Pesan saat pesan berhasil dikirim.'
              validate:
                - required
          -
            handle: message_failed
            field:
              buttons:
                - bold
                - italic
                - removeformat
                - quote
                - anchor
              container: assets
              remove_empty_nodes: false
              type: bard
              display: 'Message failed'
              instructions: 'Pesan saat pesan gagal dikirim.'
              validate:
                - required

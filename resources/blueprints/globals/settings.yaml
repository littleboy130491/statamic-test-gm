title: Settings
tabs:
  branding:
    display: Branding
    sections:
      -
        fields:
          -
            handle: site_title
            field:
              type: text
              display: 'Site title'
              localizable: true
              validate:
                - required
          -
            handle: site_logo
            field:
              type: assets
              display: 'Site logo'
              container: assets
              max_files: 1
              localizable: true
              validate:
                - required
          -
            handle: favicon
            field:
              container: assets
              max_files: 1
              type: assets
              display: Favicon
              validate:
                - required
  social:
    display: 'Social media'
    sections:
      -
        fields:
          -
            handle: social_media
            field:
              type: group
              display: 'Social media'
              localizable: true
              fields:
                -
                  handle: instagram
                  field:
                    type: group
                    display: Instagram
                    fields:
                      -
                        import: common.social_platform
                -
                  handle: facebook
                  field:
                    type: group
                    display: Facebook
                    fields:
                      -
                        import: common.social_platform
                -
                  handle: linkedin
                  field:
                    type: group
                    display: LinkedIn
                    fields:
                      -
                        import: common.social_platform
  contact:
    display: Contact
    sections:
      -
        fields:
          -
            handle: phone_numbers
            field:
              type: replicator
              display: 'Phone numbers'
              localizable: true
              collapse: true
              sets:
                phone:
                  display: 'Phone number'
                  fields:
                    -
                      import: common.contact_phone
          -
            handle: emails
            field:
              type: replicator
              display: Emails
              localizable: true
              collapse: true
              sets:
                email:
                  display: Email
                  fields:
                    -
                      import: common.contact_email
          -
            handle: address
            field:
              type: textarea
              display: Address
              localizable: true
          -
            handle: google_map_link
            field:
              type: text
              display: 'Google Maps link'
              input_type: url
              localizable: true
              validate: nullable|url
  general_settings:
    display: 'General Settings'
    sections:
      -
        display: 'Custom Code'
        fields:
          -
            handle: custom_code_head
            field:
              mode_selectable: false
              show_mode_label: false
              type: code
              display: 'Custom Code Head'
          -
            handle: custom_code_body
            field:
              mode_selectable: false
              show_mode_label: false
              type: code
              display: 'Custom Code Body'
          -
            handle: google_analytics_measurement_id
            field:
              placeholder: G-XXXXXXXXXX
              type: text
              display: 'Google Analytics - Measurement ID'
      -
        display: 'Sticky Header'
        fields:
          -
            handle: header_desktop
            field:
              type: toggle
              display: 'Header Desktop'
              width: 50
          -
            handle: header_mobile
            field:
              type: toggle
              display: 'Header Mobile'
              width: 50
          -
            handle: show_scroll_top
            field:
              default: true
              type: toggle
              display: 'Show Scroll Top'
          -
            handle: scroll_top_position
            field:
              options:
                -
                  key: left
                  value: Left
                -
                  key: right
                  value: Right
              type: select
              display: 'Scroll Top Position'
      -
        display: Translate
        fields:
          -
            handle: translate_label
            field:
              type: text
              display: 'Translate Label'
          -
            handle: embed_translate
            field:
              mode: javascript
              mode_selectable: false
              show_mode_label: false
              type: code
              display: 'Embed Translate'
  floating_whatsapp:
    display: 'Floating WhatsApp'
    sections:
      -
        display: 'Floating WhatsApp'
        fields:
          -
            handle: icon
            field:
              container: assets
              max_files: 1
              type: assets
              display: Icon
          -
            handle: label_floating
            field:
              type: text
              display: 'Label Floating'
          -
            handle: heading
            field:
              type: text
              display: Heading
          -
            handle: short_description
            field:
              type: textarea
              display: 'Short Description'
          -
            handle: position
            field:
              options:
                -
                  key: left
                  value: Left
                -
                  key: right
                  value: Right
              type: select
              display: Position
          -
            handle: show_button
            field:
              default: true
              type: toggle
              display: 'Show Button'
      -
        display: 'Contact WhatsApp'
        fields:
          -
            handle: contact_whatsapp
            field:
              type: grid
              display: 'Contact WhatsApp'
              mode: stacked
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                    width: 50
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                    width: 50
                -
                  handle: nomor_whatsapp
                  field:
                    type: float
                    display: 'Nomor WhatsApp'
                -
                  handle: message
                  field:
                    type: textarea
                    display: Message
